[project]
name = "ai-trip-planner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "langchain>=1.4.10",
    "langchain-community>=0.4.2",
    "langchain-experimental>=0.4.2",
    "langchain-google-community[places]>=5.1.1",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.4",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.24",
    "pandas>=2.3.0",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "streamlit>=1.65.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["deepeval>=3.0", "pytest>=8.0"]   # the eval suite

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "config*", "exception*", "logger*", "prompt_library*", "tools*", "utils*"]